{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white rounded-xl p-7 shadow-sm border border-gray-100">
  <h1 class="text-xl font-semibold mt-0 mb-1">Review / Approval POC</h1>
  <p class="text-gray-500 text-sm mb-5">Mock login &mdash; no password, for demo purposes only.</p>
  <form method="post" action="/ui/login">
    <label class="block text-xs font-semibold mb-1 text-gray-700">Username</label>
    <input type="text" name="username" value="{{ username or 'operator1' }}" required
      class="w-full px-2.5 py-2 border border-gray-200 rounded-md text-sm mb-4">
    <div class="flex flex-col gap-2">
      <button type="submit" name="role" value="operator"
        class="px-3.5 py-2 text-sm font-medium rounded-md bg-blue-600 text-white hover:bg-blue-700">Continue as Operator</button>
      <button type="submit" name="role" value="manager"
        class="px-3.5 py-2 text-sm font-medium rounded-md bg-gray-200 text-gray-800 hover:bg-gray-300">Continue as Manager</button>
    </div>
  </form>
  {% if error %}
  <p class="bg-red-50 text-red-800 border border-red-200 px-3 py-2 rounded-md text-sm mt-4">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
