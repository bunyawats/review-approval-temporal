{% import "_manager_row.html" as row_macros %}
<table id="request-list" hx-get="/ui/manager/list" hx-trigger="every 5s [!document.querySelector('.htmx-request')]" hx-swap="outerHTML"
  class="w-full border-collapse bg-white rounded-lg overflow-hidden shadow-sm">
  <thead>
    <tr>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50">Type</th>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50">Requester</th>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50">Status</th>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50">Comment</th>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50">Closed by</th>
      <th class="text-left px-3.5 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wide bg-gray-50"></th>
    </tr>
  </thead>
  <tbody>
    {% for r in reviews %}
    {{ row_macros.manager_row(r, permissions) }}
    {% else %}
    <tr><td colspan="6" class="px-3.5 py-2.5 text-sm text-gray-500">No requests yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
