{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <div class="flex items-center gap-2">
    <h1 class="text-xl font-semibold m-0">My Review Requests</h1>
    <span id="page-spinner" class="htmx-indicator w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></span>
  </div>
  <button
    class="px-3.5 py-2 text-sm font-medium rounded-md bg-blue-600 text-white hover:bg-blue-700"
    hx-get="/ui/operator/new-form" hx-target="#dialog-container" hx-swap="innerHTML">
    + New Request
  </button>
</div>
{% include "_operator_list.html" %}
{% endblock %}
