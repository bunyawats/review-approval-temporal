{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-xl font-semibold m-0">My Review Requests</h1>
  <button
    class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium rounded-md bg-blue-600 text-white hover:bg-blue-700"
    hx-get="/ui/operator/new-form" hx-target="#dialog-container" hx-swap="innerHTML" hx-indicator="#create-spinner">
    <span id="create-spinner" class="htmx-indicator transition-opacity duration-200 [&.htmx-request]:!duration-0 w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin [animation-duration:.3s]"></span>
    + New Request
  </button>
</div>
{% include "_operator_bulk_toolbar.html" %}
{% include "_operator_list.html" %}
{% endblock %}
