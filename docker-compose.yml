services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      # This is Temporal's own default database. Our app gets a SEPARATE
      # database (review_approval), created by db/init/01-*.sh below --
      # the two never share a schema namespace.
      POSTGRES_DB: temporal
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema.sql:/schema.sql:ro
    ports:
      # Host-side port only -- Temporal itself reaches this container via
      # the Docker-internal hostname `postgres` (POSTGRES_SEEDS below),
      # never via this published port. Off 5432 so it doesn't collide with
      # a natively-installed Postgres also listening on the host's 5432
      # (this project's app data lives there instead in that topology --
      # see CLAUDE.md's "Running locally" hybrid section).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
      - keycloak
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_AUTH_ENABLED=true
      # temporalio/ui builds its browser-facing redirect straight from
      # PROVIDER_URL (no separate browser-facing override exists), and
      # separately validates each returned token's iss claim against
      # ISSUER_URL (defaults to PROVIDER_URL if unset) -- they must
      # resolve to the exact same place both server-side (container-to-
      # container) and from the browser, or the callback 500s with an
      # "issued by a different provider" mismatch. That means the plain
      # localhost-vs-keycloak-hostname split this app's own bff service
      # uses (see CLAUDE.md's Docker networking notes) does NOT work
      # here -- instead, local dev requires a host-machine /etc/hosts
      # entry ("127.0.0.1 keycloak") so this same hostname resolves both
      # ways, and PROVIDER_URL/ISSUER_URL can just agree (see README).
      - TEMPORAL_AUTH_PROVIDER_URL=http://keycloak:8080/realms/myrealm
      - TEMPORAL_AUTH_CLIENT_ID=temporal-ui
      - TEMPORAL_AUTH_CLIENT_SECRET=temporal-ui-dev-secret-change-me
      - TEMPORAL_AUTH_CALLBACK_URL=http://localhost:8233/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
    ports:
      - "8233:8080"

  # Split into two roles on the SAME task queues -- see
  # workflow/worker.py's docstring. REVIEW_TYPE is deliberately left
  # UNSET here, so each of
  # these two services polls EVERY known review type's queue -- keeps
  # local dev simple (no per-type service per review type). Scale the two
  # roles independently:
  #   docker compose up --scale worker-workflow=3 --scale worker-activity=2
  #
  # To scale ONE review type's worker capacity independently of the
  # others (the actual point of per-type task queues), add REVIEW_TYPE to
  # a service, e.g.:
  #
  #   worker-activity-purchase-order:
  #     build: .
  #     command: python -m review_approval.workflow.worker
  #     environment:
  #       WORKER_MODE: activity
  #       REVIEW_TYPE: purchase_order
  #       DATABASE_URL: postgresql://temporal:temporal@postgres:5432/review_approval
  #       TEMPORAL_HOST: temporal:7233
  #
  # ...then scale just that service. This is the pattern Kubernetes
  # Deployments should use in production -- see CLAUDE.md's Kubernetes
  # section.
  worker-workflow:
    build: .
    command: python -m review_approval.workflow.worker
    depends_on:
      - temporal
    environment:
      WORKER_MODE: workflow
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      # No DATABASE_URL here on purpose -- workflow code is pure/
      # deterministic and never touches Postgres, so this service runs
      # with zero DB credentials.
    restart: on-failure

  worker-activity:
    build: .
    command: python -m review_approval.workflow.worker
    depends_on:
      - temporal
      - postgres
    environment:
      WORKER_MODE: activity
      DATABASE_URL: postgresql://temporal:temporal@postgres:5432/review_approval
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
    restart: on-failure

  bff:
    build: .
    command: uvicorn review_approval.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - temporal
      - postgres
      - keycloak
    environment:
      DATABASE_URL: postgresql://temporal:temporal@postgres:5432/review_approval
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      # KEYCLOAK_ISSUER is read lazily (see api/auth.py) -- the JSON API's
      # protected routes just 503 if Keycloak isn't actually reachable yet
      # when called, so this doesn't need to block bff's own startup.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/myrealm
      KEYCLOAK_CLIENT_ID: review-approval
      KEYCLOAK_CLIENT_SECRET: dev-secret-change-me
      UI_SESSION_SECRET: local-compose-dev-secret
    ports:
      - "8000:8000"
    restart: on-failure

  # Local dev only -- start-dev mode (in-memory H2, no HTTPS). Realm,
  # roles, and demo users are declared in keycloak/import/*.json and
  # loaded automatically on every startup via --import-realm; edit that
  # file and restart the container to change them, don't click through
  # the admin console for anything that should survive a restart.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

volumes:
  pg_data:
