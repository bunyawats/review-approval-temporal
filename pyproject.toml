[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-approval"
version = "0.1.0"
description = "Review/Approval workflow POC: Temporal (Python SDK) + FastAPI BFF + HTMX UI"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pyjwt[crypto]>=2.8.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["review_approval*"]

[tool.setuptools.package-data]
"review_approval.bff" = ["templates/*.html", "templates/**/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live local stack (docker compose up -d keycloak, plus native/Dockerized Postgres+Temporal+worker+bff) -- deselect with -m 'not integration'",
]
